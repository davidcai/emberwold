name: CI

on:
  push:
    branches: [main, "t0-*", "t1-*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck, lint, tests, boundaries, golden traces)
        run: pnpm verify

      - name: Random-legal fuzz (1,000 actions)
        run: pnpm fuzz --turns=1000 --seed=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Data validator
        run: python3 tools/validate_data.py
